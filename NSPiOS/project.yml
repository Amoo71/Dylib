name: NSPiOS
options:
  bundleIdPrefix: de.amoo71
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.0.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    SWIFT_COMPILATION_MODE: wholemodule
    ENABLE_TESTABILITY: NO
    # Repo, aus dessen Releases sich die App aktualisiert (CI setzt github.repository)
    NSPIOS_UPDATE_REPO: Amoo71/Dylib
targets:
  NSPiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    scheme: {}
    settings:
      base:
        PRODUCT_NAME: NSPiOS
        PRODUCT_BUNDLE_IDENTIFIER: de.amoo71.NSPiOS
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: NSPiOS
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSPiOSUpdateRepo: $(NSPIOS_UPDATE_REPO)
        # Sideload-Apps, an die Updates übergeben werden können
        LSApplicationQueriesSchemes:
          - apple-magnifier
          - sidestore
          - altstore
        # Documents-Ordner der App in der Dateien-App sichtbar machen
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleDocumentTypes:
          - CFBundleTypeName: Nintendo Switch Package / Gamecard
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - de.amoo71.nspios.nsp
              - de.amoo71.nspios.nsz
              - de.amoo71.nspios.xci
              - de.amoo71.nspios.xcz
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: de.amoo71.nspios.nsp
            UTTypeDescription: Nintendo Switch Package
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [nsp]
          - UTTypeIdentifier: de.amoo71.nspios.nsz
            UTTypeDescription: Komprimiertes Nintendo Switch Package
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [nsz]
          - UTTypeIdentifier: de.amoo71.nspios.xci
            UTTypeDescription: Nintendo Switch Gamecard Image
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [xci]
          - UTTypeIdentifier: de.amoo71.nspios.xcz
            UTTypeDescription: Komprimiertes Nintendo Switch Gamecard Image
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [xcz]
