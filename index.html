<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEGO AI Builder</title><style>body{margin:0;background:#101216;color:#eee;font:14px system-ui}.top{height:58px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #30343b}.app{display:grid;grid-template-columns:330px 1fr 300px;height:calc(100vh - 59px)}aside{padding:12px;overflow:auto;border-right:1px solid #30343b}.right{border-right:0;border-left:1px solid #30343b}.cat{border:1px solid #30343b;border-radius:8px;margin-bottom:7px;padding:6px}.cat summary{cursor:pointer;font-weight:700}.part{display:grid;grid-template-columns:1fr 55px;gap:5px;align-items:center;margin:5px 0}.part input,button,textarea{background:#1b1e24;color:#fff;border:1px solid #3a4049;border-radius:7px;padding:8px}.part input{width:55px}.btn{cursor:pointer}.primary{width:100%;background:#d71920;border-color:#d71920;font-weight:700}.workspace{position:relative;overflow:auto;background:#090b0e}.grid{margin:55px auto;width:720px;height:540px;display:grid;grid-template-columns:repeat(24,30px);grid-template-rows:repeat(18,30px);background:#171a1f}.cell{border:1px solid #252a31;position:relative}.piece{position:absolute;left:1px;top:1px;border:1px solid #0008;border-radius:4px;box-shadow:inset 0 2px #fff2,0 2px 3px #0008;cursor:pointer;overflow:hidden}.piece:after{content:'•';position:absolute;left:50%;top:50%;transform:translate(-50%,-55%);color:#fff5;font-size:14px}.toolbar{position:absolute;top:12px;left:12px;z-index:2;display:flex;gap:6px}.colors{display:flex;gap:6px;flex-wrap:wrap}.color{width:27px;height:27px;border-radius:50%;padding:0}.steps{padding:10px}.step{border:1px solid #30343b;border-radius:7px;padding:8px;margin:5px 0}.muted{color:#9299a3}textarea{width:100%;height:80px;resize:vertical;box-sizing:border-box}.status{min-height:18px;color:#9ca3af;margin-top:7px;font-size:12px}</style></head><body><div class="top"><b>🧱 LEGO AI Builder</b><span style="margin-left:auto;color:#9ca3af">Inventar → KI → Bauplan → Editor</span></div><div class="app"><aside><h3>Dein Inventar</h3><div class="muted">Jedes Teil hat eine eigene Menge. Die KI darf nur diese Teile verwenden.</div><div id="inventory"></div><h3>Farbe</h3><div class="colors" id="colors"></div></aside><main class="workspace"><div class="toolbar"><select id="part"></select><button class="btn" id="rot">↻</button><button class="btn" id="undo">↶</button><button class="btn" id="clear">Leeren</button></div><div class="grid" id="grid"></div></main><aside class="right"><h3>🤖 KI-Baumeister</h3><textarea id="request" placeholder="z.B. ein Haus mit 2 Fenstern, Tür und rotem Dach"></textarea><button class="primary btn" id="build">Bauplan erstellen</button><div class="status" id="status"></div><h3>Bauschritte</h3><div class="steps" id="steps"><span class="muted">Noch kein Plan.</span></div><button class="btn" id="save">Export</button> <button class="btn" id="load">Import</button><input id="file" type="file" hidden accept="application/json"></aside></div><script type="module">import{PART_CATEGORIES,PARTS}from './parts-catalog.js';import{generateLocalPlan}from './local-ai.js';const labels={bricks:'🧱 Steine',plates:'▫️ Platten',slopes:'⛰️ Slopes',windows:'🪟 Fenster & Türen',wheels:'🛞 Räder & Achsen',plants:'🌿 Pflanzen',round:'⚪ Rundteile',special:'🧩 Spezialteile'};const stock=JSON.parse(localStorage.getItem('lego-stock-v2')||'{}');for(const id of Object.keys(PARTS))if(stock[id]==null)stock[id]=PARTS[id].defaultCount;const inv=document.querySelector('#inventory'),sel=document.querySelector('#part');for(const[cat,ids]of Object.entries(PART_CATEGORIES)){const d=document.createElement('details');d.className='cat';d.open=cat==='bricks';d.innerHTML='<summary>'+labels[cat]+'</summary>';for(const id of ids){const row=document.createElement('label');row.className='part';row.innerHTML=`<span>${id}</span><input min="0" type="number" value="${stock[id]}">`;row.querySelector('input').onchange=e=>{stock[id]=Math.max(0,+e.target.value||0);localStorage.setItem('lego-stock-v2',JSON.stringify(stock))};d.appendChild(row);const o=document.createElement('option');o.value=id;o.textContent=id;sel.appendChild(o)}inv.appendChild(d)}const colors=['#d71920','#2563eb','#facc15','#fff','#171717','#16a34a','#f97316','#a855f7','#8b4513'];let color=colors[0],rotation=0,pieces=[],history=[];for(const c of colors){const b=document.createElement('button');b.className='color';b.style.background=c;b.onclick=()=>color=c;document.querySelector('#colors').appendChild(b)}const grid=document.querySelector('#grid');for(let i=0;i<432;i++){const c=document.createElement('div');c.className='cell';c.onclick=()=>place(i);grid.appendChild(c)}function dims(id,r=rotation){const m=id.match(/(\d+)x(\d+)/);if(!m)return[1,1];let a=+m[1],b=+m[2];return r%2?[b,a]:[a,b]}function place(i){const id=sel.value,d=dims(id),x=i%24,y=Math.floor(i/24);if(x+d[1]>24||y+d[0]>18)return;if(pieces.filter(p=>p.part===id).length>=stock[id])return;history.push(JSON.stringify(pieces));pieces.push({part:id,x,y,z:0,rotation,color});render()}function render(){grid.querySelectorAll('.piece').forEach(x=>x.remove());for(const[pIndex,p]of pieces.entries()){const d=dims(p.part,p.rotation),cell=grid.children[p.y*24+p.x],e=document.createElement('div');e.className='piece';e.style.background=p.color;e.style.width=d[1]*30-3+'px';e.style.height=d[0]*30-3+'px';e.title=p.part+' · entfernen';e.onclick=ev=>{ev.stopPropagation();history.push(JSON.stringify(pieces));pieces.splice(pIndex,1);render()};cell.appendChild(e)}document.querySelector('#steps').innerHTML=pieces.length?pieces.map((p,i)=>`<div class="step"><b>${i+1}.</b> ${p.part} · (${p.x+1},${p.y+1})</div>`).join(''):'<span class="muted">Noch kein Plan.</span>'}document.querySelector('#rot').onclick=()=>rotation=(rotation+1)%2;document.querySelector('#undo').onclick=()=>{if(history.length){pieces=JSON.parse(history.pop());render()}};document.querySelector('#clear').onclick=()=>{history.push(JSON.stringify(pieces));pieces=[];render()};document.querySelector('#build').onclick=async()=>{const q=document.querySelector('#request').value.trim(),s=document.querySelector('#status');if(!q)return;s.textContent='KI baut aus deinem Bestand …';try{const plan=await generateLocalPlan(q,stock);if(!plan.steps?.length)throw Error('Zu wenig passende Teile');history.push(JSON.stringify(pieces));pieces=plan.steps.map(p=>({...p,part:p.part||p.size})).filter(p=>PARTS[p.part]);render();s.textContent='✓ '+plan.name+' · '+pieces.length+' Teile';}catch(e){s.textContent='Kein gültiger Plan: '+e.message}};document.querySelector('#save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({stock,pieces},null,2)],{type:'application/json'}));a.download='lego-plan.json';a.click()};document.querySelector('#load').onclick=()=>document.querySelector('#file').click();document.querySelector('#file').onchange=e=>{const r=new FileReader();r.onload=()=>{const d=JSON.parse(r.result);Object.assign(stock,d.stock||{});pieces=d.pieces||[];render()};r.readAsText(e.target.files[0])};render();</script></body></html>
