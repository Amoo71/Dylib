<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Liquid Browser iOS Concept</title>
    <meta
      name="description"
      content="Modernes Safari-ähnliches Browser-Konzept mit Liquid-Glass Design, Tool-Bubbles und Devtools-Overlay."
    />
    <meta name="theme-color" content="#0b0f1d" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="ambient ambient-left"></div>
    <div class="ambient ambient-right"></div>

    <main class="app-shell">
      <header class="topbar liquid-card">
        <div>
          <p class="eyebrow">iOS Browser Concept</p>
          <h1>Liquid Browser</h1>
        </div>
        <button id="pipToggle" class="mini-pill" aria-label="PiP Vorschau umschalten">PiP</button>
      </header>

      <section class="browser-stage liquid-card" aria-label="Browser Ansicht">
        <div class="window-top">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
          <p id="activeStatus" class="status">Bereit</p>
        </div>

        <iframe
          id="browserView"
          title="Browser Vorschau"
          src="https://example.com"
          referrerpolicy="no-referrer"
        ></iframe>

        <video id="mockVideo" class="floating-video" muted loop playsinline>
          <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4" />
        </video>
      </section>

      <section id="networkPanel" class="network-panel liquid-card" hidden>
        <div class="panel-head">
          <h2>Network Recorder</h2>
          <div class="panel-actions">
            <button id="startRecord" class="mini-pill">Start</button>
            <button id="stopRecord" class="mini-pill">Stop</button>
            <button id="clearRecord" class="mini-pill">Clear</button>
          </div>
        </div>
        <ul id="networkList" class="network-list"></ul>
      </section>
    </main>

    <nav class="bottom-dock" aria-label="Browser Steuerung">
      <button id="optionsToggle" class="bubble option-bubble" aria-label="Optionen öffnen">⚙️</button>
      <form id="urlForm" class="bubble url-bubble" autocomplete="off">
        <input id="urlInput" name="url" type="text" placeholder="URL eingeben oder Suche starten" />
        <button type="submit" class="go-btn">Go</button>
      </form>
    </nav>

    <aside id="optionSheet" class="option-sheet liquid-card" hidden>
      <h3>Browser Optionen</h3>
      <div class="toggle-row">
        <span>Built-in Ad Blocker</span>
        <input id="adBlocker" type="checkbox" checked />
      </div>
      <div class="toggle-row">
        <span>Anti-New-Tab (Ad Redirects)</span>
        <input id="antiNewTab" type="checkbox" checked />
      </div>
      <div class="toggle-row">
        <span>Proxy Auto Switch</span>
        <input id="proxySwitch" type="checkbox" />
      </div>
      <div class="toggle-row">
        <span>Developer Network Panel</span>
        <input id="devtoolsToggle" type="checkbox" checked />
      </div>

      <div class="proxy-box">
        <label for="proxyList">Proxy Liste (eine URL pro Zeile)</label>
        <textarea id="proxyList" rows="4">https://proxy-1.example
https://proxy-2.example
socks5://proxy-3.example</textarea>
        <button id="proxyTest" class="mini-pill" type="button">Proxy testen & wechseln</button>
      </div>
      <p id="sheetMessage" class="sheet-message"></p>
    </aside>

    <script src="script.js"></script>
  </body>
</html>
