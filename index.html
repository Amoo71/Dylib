<!doctype html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEGO AI Builder</title><style>*{box-sizing:border-box}body{margin:0;background:#101216;color:#f4f4f5;font-family:system-ui}header{height:64px;padding:0 20px;display:flex;align-items:center;border-bottom:1px solid #292d34}header h1{font-size:20px;margin:0}.app{display:grid;grid-template-columns:330px 1fr 300px;height:calc(100vh - 64px)}aside{padding:16px;border-right:1px solid #292d34;overflow:auto}.right{border-left:1px solid #292d34}.panel{margin-bottom:20px}.panel h2{font-size:13px;text-transform:uppercase;color:#9ca3af;margin:0 0 10px}.inventory{display:grid;gap:8px}details{border:1px solid #2b3038;border-radius:8px;margin-bottom:8px;padding:7px}summary{cursor:pointer;font-weight:700;text-transform:capitalize}.partrow{display:grid;grid-template-columns:1fr 65px;gap:6px;margin:5px 0;align-items:center}.partrow input,button,input,select{background:#1b1e24;color:#fff;border:1px solid #363b44;border-radius:8px;padding:9px}.partrow input{width:65px}button{cursor:pointer}button:hover{background:#252a32}.primary{width:100%;background:#e11d2e;border-color:#e11d2e;font-weight:700}.colors{display:flex;gap:7px;flex-wrap:wrap}.color{width:30px;height:30px;padding:0;border-radius:50%;border:2px solid #555}.workspace{position:relative;overflow:auto;background:#0b0d10}.grid{margin:30px auto;width:720px;height:540px;display:grid;grid-template-columns:repeat(24,30px);grid-template-rows:repeat(18,30px);background:#171a1f;box-shadow:0 0 0 1px #343942}.cell{border:1px solid #252a31;position:relative}.brick{position:absolute;border-radius:5px;border:2px solid #0003;box-shadow:inset 0 2px 0 #fff2,0 2px 3px #0008;cursor:grab}.toolbar{position:absolute;top:12px;left:12px;display:flex;gap:7px;z-index:2}.steps{padding:16px}.step{padding:10px;border:1px solid #30343c;border-radius:8px;margin-bottom:8px}.muted{color:#9ca3af;font-size:13px}#chat{height:90px;width:100%;resize:none;background:#1b1e24;color:white;border:1px solid #363b44;border-radius:8px;padding:10px}#status{font-size:12px;color:#9ca3af;margin-top:8px;min-height:16px}.hint{font-size:12px;color:#9ca3af;margin:8px 0}</style></head><body><header><h1>🧱 LEGO AI Builder</h1></header><div class="app"><aside><div class="panel"><h2>Mein Teilebestand</h2><div class="hint">Trage exakt ein, wie viele Teile du besitzt. Die KI darf nichts darüber hinaus verwenden.</div><div class="inventory" id="inventory"></div></div><div class="panel"><h2>Aktiver Grundstein</h2><select id="size" style="width:100%"></select></div><div class="panel"><h2>Farbe</h2><div class="colors" id="colors"></div></div><button class="primary" id="clear">Baufläche leeren</button></aside><main class="workspace"><div class="toolbar"><button id="rotate">↻ Drehen</button><button id="undo">↶ Rückgängig</button></div><div class="grid" id="grid"></div></main><aside class="right"><div class="panel"><h2>🤖 KI-Baumeister</h2><p class="muted">Kostenloser lokaler Planer. Er nutzt deinen angegebenen Bestand.</p><textarea id="chat" placeholder="z.B. ein Haus mit Fenster und rotem Dach"></textarea><button class="primary" style="margin-top:8px" id="build">Bauplan erstellen</button><div id="status"></div></div><div class="panel"><h2>Bauschritte</h2><div id="steps" class="steps"><p class="muted">Noch kein Bauplan.</p></div></div><div class="panel"><button id="save">Bauplan exportieren</button> <button id="loadBtn">Importieren</button><input id="file" type="file" accept="application/json" hidden></div></aside></div><script>const C={bricks:[['1x1','1x1'],['1x2','1x2'],['1x3','1x3'],['1x4','1x4'],['1x6','1x6'],['1x8','1x8'],['2x2','2x2'],['2x3','2x3'],['2x4','2x4'],['2x6','2x6'],['2x8','2x8']],plates:[['plate-1x1','Platte 1x1'],['plate-1x2','Platte 1x2'],['plate-2x4','Platte 2x4'],['plate-2x6','Platte 2x6'],['plate-2x8','Platte 2x8']],slopes:[['slope-1x1','Slope 1x1'],['slope-1x2','Slope 1x2'],['slope-1x3','Slope 1x3'],['slope-2x2','Slope 2x2'],['slope-2x4','Slope 2x4']],windows:[['window-1x2','Fenster 1x2'],['window-1x4','Fenster 1x4'],['window-2x2','Fenster 2x2'],['window-2x4','Fenster 2x4'],['door-1x4','Tür']],wheels:[['wheel-small','Kleines Rad'],['wheel-medium','Rad'],['wheel-large','Großes Rad'],['wheel-with-axle','Rad mit Achse'],['axle-2','Achse 2'],['axle-4','Achse 4'],['axle-6','Achse 6']],plants:[['leaf','Blatt'],['leaf-branch','Blattzweig'],['flower','Blume'],['stem','Stiel'],['bush','Busch']],special:[['hinge','Scharnier'],['clip','Clip'],['bar','Stange'],['bracket','Bracket'],['tile-1x1','Tile 1x1'],['tile-1x2','Tile 1x2'],['tile-2x2','Tile 2x2']]};const colors=[['#e11d2e','Rot'],['#2563eb','Blau'],['#facc15','Gelb'],['#fff','Weiß'],['#171717','Schwarz'],['#16a34a','Grün'],['#f97316','Orange'],['#a855f7','Lila']];let stock=JSON.parse(localStorage.getItem('lego-stock')||'{}'),pieces=[],selectedColor='#e11d2e',rotation=0,history=[];for(const cat of Object.values(C))for(const [id] of cat)if(stock[id]==null)stock[id]=id.includes('wheel')||id.includes('window')||id.includes('door')?2:5;const inv=document.getElementById('inventory'),sel=document.getElementById('size');for(const [cat,parts] of Object.entries(C)){let d=document.createElement('details');d.open=cat==='bricks';let s=document.createElement('summary');s.textContent=cat;d.appendChild(s);for(const [id,label] of parts){let r=document.createElement('label');r.className='partrow';r.innerHTML=`<span>${label}</span><input type="number" min="0" value="${stock[id]}" data-part="${id}">`;r.querySelector('input').onchange=e=>{stock[id]=Math.max(0,+e.target.value||0);localStorage.setItem('lego-stock',JSON.stringify(stock))};d.appendChild(r);if(cat==='bricks'){let o=document.createElement('option');o.value=id;o.textContent=label;sel.appendChild(o)}}inv.appendChild(d)}colors.forEach(c=>{let b=document.createElement('button');b.className='color';b.style.background=c[0];b.title=c[1];b.onclick=()=>selectedColor=c[0];document.getElementById('colors').appendChild(b)});const grid=document.getElementById('grid');for(let i=0;i<432;i++){let c=document.createElement('div');c.className='cell';c.onclick=()=>place(i);grid.appendChild(c)}function dims(s,r=rotation){let [a,b]=s.split('x').map(Number);return r%2?[b,a]:[a,b]}function place(i){let s=sel.value,d=dims(s),x=i%24,y=Math.floor(i/24);if(x+d[1]>24||y+d[0]>18)return;if(pieces.filter(p=>p.size===s).length>=stock[s])return;history.push(JSON.stringify(pieces));pieces.push({size:s,color:selectedColor,x,y,z:0,rotation});render()}function render(){grid.querySelectorAll('.brick').forEach(e=>e.remove());pieces.forEach((p,n)=>{let d=dims(p.size,p.rotation),c=grid.children[p.y*24+p.x],b=document.createElement('div');b.className='brick';b.style.background=p.color;b.style.width=d[1]*30-2+'px';b.style.height=d[0]*30-2+'px';b.onclick=e=>{e.stopPropagation();history.push(JSON.stringify(pieces));pieces.splice(n,1);render()};c.appendChild(b)});document.getElementById('steps').innerHTML=pieces.length?pieces.map((p,i)=>`<div class="step"><b>${i+1}.</b> ${p.size} · ${p.x+1},${p.y+1}</div>`).join(''):'<p class="muted">Noch kein Bauplan.</p>'}document.getElementById('rotate').onclick=()=>rotation=(rotation+1)%2;document.getElementById('undo').onclick=()=>{if(history.length){pieces=JSON.parse(history.pop());render()}};document.getElementById('clear').onclick=()=>{history.push(JSON.stringify(pieces));pieces=[];render()};document.getElementById('build').onclick=async()=>{const q=document.getElementById('chat').value.trim(),st=document.getElementById('status');if(!q)return;st.textContent='Erstelle Bauplan …';try{const {generateLocalPlan}=await import('./local-ai.js');const plan=await generateLocalPlan(q,stock);if(!plan.steps.length)throw Error('Mit diesem Bestand keine passende Konstruktion gefunden');history.push(JSON.stringify(pieces));pieces=plan.steps.filter(p=>C.bricks.some(x=>x[0]===p.size));render();st.textContent=`✓ ${plan.name} · ${pieces.length} verwendete Teile`;}catch(e){st.textContent='Kein passender Plan: '+e.message}};document.getElementById('save').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({stock,pieces},null,2)],{type:'application/json'}));a.download='lego-bauplan.json';a.click()};document.getElementById('loadBtn').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=e=>{let r=new FileReader();r.onload=()=>{let d=JSON.parse(r.result);stock=d.stock;pieces=d.pieces;render()};r.readAsText(e.target.files[0])};render();</script></body></html>
