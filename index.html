<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEGO AI Builder</title><style>body{margin:0;background:#101216;color:#eee;font:14px system-ui}.top{height:58px;display:flex;align-items:center;padding:0 16px;border-bottom:1px solid #30343b}.app{display:grid;grid-template-columns:330px 1fr 300px;height:calc(100vh - 59px)}aside{padding:12px;overflow:auto;border-right:1px solid #30343b}.right{border-left:1px solid #30343b}.cat{border:1px solid #30343b;border-radius:8px;margin-bottom:7px;padding:6px}.cat summary{cursor:pointer;font-weight:700}.part{display:grid;grid-template-columns:1fr 55px;gap:5px;align-items:center;margin:5px 0}.part input,button,textarea,select{background:#1b1e24;color:#fff;border:1px solid #3a4049;border-radius:7px;padding:8px}.part input{width:55px}.btn{cursor:pointer}.primary{width:100%;background:#d71920;border-color:#d71920;font-weight:700}.workspace{position:relative;overflow:auto;background:#090b0e}.grid{margin:55px auto;width:720px;height:540px;display:grid;grid-template-columns:repeat(24,30px);grid-template-rows:repeat(18,30px);background:#171a1f}.cell{border:1px solid #252a31;position:relative}.piece{position:absolute;left:1px;top:1px;border:1px solid #0008;border-radius:4px;box-shadow:inset 0 2px #fff2,0 2px 3px #0008;cursor:grab;overflow:hidden;touch-action:none}.piece:active{cursor:grabbing}.piece:after{content:'•';position:absolute;left:50%;top:50%;transform:translate(-50%,-55%);color:#fff5;font-size:14px}.piece.slope{clip-path:polygon(0 100%,100% 100%,100% 0,0 0)}.piece.window{background-image:linear-gradient(90deg,transparent 45%,#fff8 45%,#fff8 55%,transparent 55%),linear-gradient(transparent 45%,#fff8 45%,#fff8 55%,transparent 55%)}.piece.wheel{border-radius:50%;box-shadow:inset 0 0 0 5px #222,inset 0 0 0 9px #777,0 2px 3px #0008}.piece.leaf{border-radius:50% 0 50% 0;transform:rotate(-35deg)}.piece.door{background-image:linear-gradient(90deg,transparent 72%,#facc15 72%,#facc15 78%,transparent 78%)}.toolbar{position:absolute;top:12px;left:12px;z-index:2;display:flex;gap:6px}.colors{display:flex;gap:6px;flex-wrap:wrap}.color{width:27px;height:27px;border-radius:50%;padding:0}.steps{padding:10px}.step{border:1px solid #30343b;border-radius:7px;padding:8px;margin:5px 0}.muted{color:#9299a3}textarea{width:100%;height:80px;resize:vertical;box-sizing:border-box}.status{min-height:18px;color:#9ca3af;margin-top:7px;font-size:12px}.grid3d{display:none;position:absolute;inset:0;background:#0b0d10}.grid3d.active{display:block}</style></head><body><div class="top"><b>🧱 LEGO AI Builder</b><span style="margin-left:auto;color:#9ca3af">Inventar → KI → Bauplan → Editor</span></div><div class="app"><aside><h3>Dein Inventar</h3><div class="muted">Mengen sind deine echten verfügbaren Teile.</div><div id="inventory"></div><h3>Farbe</h3><div class="colors" id="colors"></div></aside><main class="workspace"><div class="toolbar"><select id="part"></select><button class="btn" id="rot">↻</button><button class="btn" id="undo">↶</button><button class="btn" id="clear">Leeren</button><button class="btn" id="view">3D</button></div><div class="grid" id="grid"></div><canvas id="canvas3d" class="grid3d"></canvas></main><aside class="right"><h3>🤖 KI-Baumeister</h3><textarea id="request" placeholder="z.B. ein Haus mit 2 Fenstern, Tür und rotem Dach"></textarea><button class="primary btn" id="build">Bauplan erstellen</button><div class="status" id="status"></div><h3>Bauschritte</h3><div class="steps" id="steps"><span class="muted">Noch kein Plan.</span></div><button class="btn" id="save">Export</button> <button class="btn" id="load">Import</button><input id="file" type="file" hidden accept="application/json"></aside></div><script type="module">import{PART_CATEGORIES,PARTS}from'./parts-catalog.js';import{generateLocalPlan}from'./local-ai.js';import{validate}from'./placement-engine.js';const labels={bricks:'🧱 Steine',plates:'▫️ Platten',slopes:'⛰️ Slopes',windows:'🪟 Fenster & Türen',wheels:'🛞 Räder & Achsen',plants:'🌿 Pflanzen',round:'⚪ Rundteile',special:'🧩 Spezialteile'};const stock=JSON.parse(localStorage.getItem('lego-stock-v2')||'{}');for(const id of Object.keys(PARTS))if(stock[id]==null)stock[id]=PARTS[id].defaultCount;const inv=document.querySelector('#inventory'),sel=document.querySelector('#part');for(const[cat,ids]of Object.entries(PART_CATEGORIES)){const d=document.createElement('details');d.className='cat';d.open=cat==='bricks';d.innerHTML='<summary>'+labels[cat]+'</summary>';for(const id of ids){const row=document.createElement('label');row.className='part';row.innerHTML=`<span>${id}</span><input min="0" type="number" value="${stock[id]}">`;row.querySelector('input').onchange=e=>{stock[id]=Math.max(0,+e.target.value||0);localStorage.setItem('lego-stock-v2',JSON.stringify(stock))};d.appendChild(row);const o=document.createElement('option');o.value=id;o.textContent=id;sel.appendChild(o)}inv.appendChild(d)}const colors=['#d71920','#2563eb','#facc15','#fff','#171717','#16a34a','#f97316','#a855f7','#8b4513'];let color=colors[0],rotation=0,pieces=[],history=[],drag=null;for(const c of colors){const b=document.createElement('button');b.className='color';b.style.background=c;b.onclick=()=>color=c;document.querySelector('#colors').appendChild(b)}const grid=document.querySelector('#grid');for(let i=0;i<432;i++){const c=document.createElement('div');c.className='cell';c.onclick=()=>place(i);grid.appendChild(c)}function dims(id,r=rotation){const m=id.match(/(\d+)x(\d+)/);if(!m)return[1,1];let a=+m[1],b=+m[2];return r%2?[b,a]:[a,b]}function cls(id){return /slope/.test(id)?'slope':/window/.test(id)?'window':/wheel/.test(id)?'wheel':/leaf|bush|flower|stem/.test(id)?'leaf':/door/.test(id)?'door':''}function valid(next){return validate(next,stock).valid}function place(i){const id=sel.value,d=dims(id),x=i%24,y=Math.floor(i/24),p={part:id,x,y,z:0,rotation,color};if(x+d[1]>24||y+d[0]>18||!valid([...pieces,p])||pieces.filter(p=>p.part===id).length>=stock[id])return;history.push(JSON.stringify(pieces));pieces.push(p);render()}function render(){grid.querySelectorAll('.piece').forEach(x=>x.remove());for(const[pIndex,p]of pieces.entries()){const d=dims(p.part,p.rotation),cell=grid.children[p.y*24+p.x],e=document.createElement('div');e.className='piece '+cls(p.part);e.dataset.index=pIndex;e.style.background=p.color;e.style.width=d[1]*30-3+'px';e.style.height=d[0]*30-3+'px';e.title=p.part+' · ziehen zum Verschieben · klicken zum Löschen';e.onpointerdown=ev=>startDrag(ev,pIndex);e.onclick=ev=>{if(ev.detail>1)return;};cell.appendChild(e)}document.querySelector('#steps').innerHTML=pieces.length?pieces.map((p,i)=>`<div class="step"><b>${i+1}.</b> ${p.part} · (${p.x+1},${p.y+1})</div>`).join(''):'<span class="muted">Noch kein Plan.</span>'}function startDrag(ev,index){ev.preventDefault();ev.stopPropagation();const p=pieces[index],startX=p.x,startY=p.y;drag={index,pointerId:ev.pointerId,startX,startY,moved:false};ev.currentTarget.setPointerCapture?.(ev.pointerId);const move=e=>{if(!drag||e.pointerId!==drag.pointerId)return;const rect=grid.getBoundingClientRect(),nx=Math.max(0,Math.min(23,Math.round((e.clientX-rect.left)/30))),ny=Math.max(0,Math.min(17,Math.round((e.clientY-rect.top)/30)));if(nx!==startX||ny!==startY)drag.moved=true;const el=e.currentTarget;el.style.transform=`translate(${(nx-startX)*30}px,${(ny-startY)*30}px)`};const up=e=>{if(!drag||e.pointerId!==drag.pointerId)return;const rect=grid.getBoundingClientRect(),nx=Math.max(0,Math.min(23,Math.round((e.clientX-rect.left)/30))),ny=Math.max(0,Math.min(17,Math.round((e.clientY-rect.top)/30)));e.currentTarget.releasePointerCapture?.(e.pointerId);e.currentTarget.removeEventListener('pointermove',move);e.currentTarget.removeEventListener('pointerup',up);const next=pieces.map((x,i)=>i===index?{...x,x:nx,y:ny}:x);if(drag.moved&&valid(next)){history.push(JSON.stringify(pieces));pieces=next;render()}else if(!drag.moved){history.push(JSON.stringify(pieces));pieces.splice(index,1);render()}else render();drag=null};ev.currentTarget.addEventListener('pointermove',move);ev.currentTarget.addEventListener('pointerup',up)}document.querySelector('#rot').onclick=()=>rotation=(rotation+1)%2;document.querySelector('#undo').onclick=()=>{if(history.length){pieces=JSON.parse(history.pop());render()}};document.querySelector('#clear').onclick=()=>{history.push(JSON.stringify(pieces));pieces=[];render()};document.querySelector('#build').onclick=async()=>{const q=document.querySelector('#request').value.trim(),s=document.querySelector('#status');if(!q)return;s.textContent='KI baut aus deinem Bestand …';try{const plan=await generateLocalPlan(q,stock);if(!plan.steps?.length)throw Error('Zu wenig passende Teile');const next=plan.steps.map(p=>({...p,part:p.part||p.size})).filter(p=>PARTS[p.part]);const check=validate(next,stock);if(!check.valid)throw Error(check.errors[0]);history.push(JSON.stringify(pieces));pieces=next;render();s.textContent='✓ '+plan.name+' · '+pieces.length+' Teile';}catch(e){s.textContent='Kein gültiger Plan: '+e.message}};document.querySelector('#save').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({stock,pieces},null,2)],{type:'application/json'}));a.download='lego-plan.json';a.click()};document.querySelector('#load').onclick=()=>document.querySelector('#file').click();document.querySelector('#file').onchange=e=>{const r=new FileReader();r.onload=()=>{const d=JSON.parse(r.result);Object.assign(stock,d.stock||{});pieces=d.pieces||[];render()};r.readAsText(e.target.files[0])};const cv=document.querySelector('#canvas3d');document.querySelector('#view').onclick=()=>{cv.classList.toggle('active');if(cv.classList.contains('active')){cv.width=cv.clientWidth;cv.height=cv.clientHeight;const c=cv.getContext('2d');c.clearRect(0,0,cv.width,cv.height);c.fillStyle='#eee';c.font='18px system-ui';c.fillText('3D-Ansicht – Bauplan '+pieces.length+' Teile',20,35);let y=70;for(const p of pieces){c.fillText(`${p.part}  @ ${p.x+1},${p.y+1},${(p.z||0)+1}`,20,y);y+=25;if(y>cv.height-20)break}}};render();</script></body></html>
