<!doctype html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LEGO AI Builder</title><style>*{box-sizing:border-box}body{margin:0;background:#101216;color:#f4f4f5;font-family:system-ui}header{height:64px;padding:0 20px;display:flex;align-items:center;border-bottom:1px solid #292d34}header h1{font-size:20px;margin:0}.app{display:grid;grid-template-columns:300px 1fr 280px;height:calc(100vh - 64px)}aside{padding:16px;border-right:1px solid #292d34;overflow:auto}.right{border-left:1px solid #292d34}.panel{margin-bottom:20px}.panel h2{font-size:13px;text-transform:uppercase;color:#9ca3af;margin:0 0 10px}.row{display:flex;gap:8px;margin-bottom:8px}button,input,select{background:#1b1e24;color:#fff;border:1px solid #363b44;border-radius:8px;padding:9px}button{cursor:pointer}button:hover{background:#252a32}.primary{width:100%;background:#e11d2e;border-color:#e11d2e;font-weight:700}.inventory{display:grid;grid-template-columns:1fr 70px;gap:7px}.inventory input{width:70px}.colors{display:flex;gap:7px;flex-wrap:wrap}.color{width:30px;height:30px;padding:0;border-radius:50%;border:2px solid #555}.workspace{position:relative;overflow:auto;background:#0b0d10}.grid{margin:30px auto;width:720px;height:540px;display:grid;grid-template-columns:repeat(24,30px);grid-template-rows:repeat(18,30px);background:#171a1f;box-shadow:0 0 0 1px #343942}.cell{border:1px solid #252a31;position:relative}.brick{position:absolute;border-radius:5px;border:2px solid #0003;box-shadow:inset 0 2px 0 #fff2,0 2px 3px #0008;cursor:grab}.toolbar{position:absolute;top:12px;left:12px;display:flex;gap:7px}.steps{padding:16px}.step{padding:10px;border:1px solid #30343c;border-radius:8px;margin-bottom:8px}.muted{color:#9ca3af;font-size:13px}#chat{height:90px;width:100%;resize:none;background:#1b1e24;color:white;border:1px solid #363b44;border-radius:8px;padding:10px}</style></head><body><header><h1>🧱 LEGO AI Builder</h1></header><div class="app"><aside><div class="panel"><h2>Meine Steine</h2><div class="inventory" id="inventory"></div></div><div class="panel"><h2>Stein</h2><select id="size" style="width:100%"><option>1x1</option><option>1x2</option><option>1x3</option><option>1x4</option><option>1x6</option><option>2x2</option><option>2x3</option><option>2x4</option><option>2x6</option><option>2x8</option></select></div><div class="panel"><h2>Farbe</h2><div class="colors" id="colors"></div></div><div class="panel"><button class="primary" id="clear">Baufläche leeren</button></div></aside><main class="workspace"><div class="toolbar"><button id="rotate">↻ Drehen</button><button id="undo">↶ Rückgängig</button></div><div class="grid" id="grid"></div></main><aside class="right"><div class="panel"><h2>🤖 KI-Baumeister</h2><p class="muted">Beschreibe, was du aus deinem Bestand bauen möchtest.</p><textarea id="chat" placeholder="z.B. Ein kleines rotes Auto"></textarea><button class="primary" style="margin-top:8px" id="build">Bauplan erstellen</button></div><div class="panel"><h2>Bauschritte</h2><div id="steps" class="steps"><p class="muted">Noch kein Bauplan.</p></div></div><div class="panel"><button id="save">Bauplan exportieren</button> <button id="loadBtn">Importieren</button><input id="file" type="file" accept="application/json" hidden></div></aside></div><script>const sizes=['1x1','1x2','1x3','1x4','1x6','2x2','2x3','2x4','2x6','2x8'];const cols=[['#e11d2e','Rot'],['#2563eb','Blau'],['#facc15','Gelb'],['#fff','Weiß'],['#171717','Schwarz'],['#16a34a','Grün'],['#f97316','Orange']];let stock={};sizes.forEach(s=>stock[s]=5);let pieces=[],selectedColor=cols[0][0],rotation=0,history=[];const inv=document.getElementById('inventory'),grid=document.getElementById('grid');sizes.forEach(s=>{inv.innerHTML+=`<label>${s}<input type="number" min="0" value="5" data-s="${s}"></label>`});inv.querySelectorAll('input').forEach(i=>i.onchange=()=>stock[i.dataset.s]=+i.value);cols.forEach(c=>{let b=document.createElement('button');b.className='color';b.style.background=c[0];b.title=c[1];b.onclick=()=>selectedColor=c[0];document.getElementById('colors').appendChild(b)});for(let i=0;i<432;i++){let c=document.createElement('div');c.className='cell';c.onclick=()=>place(i);grid.appendChild(c)}function dims(s){let [a,b]=s.split('x').map(Number);return rotation%2?[b,a]:[a,b]}function place(i){let s=document.getElementById('size').value,d=dims(s),x=i%24,y=Math.floor(i/24);if(x+d[1]>24||y+d[0]>18)return;let used=pieces.filter(p=>p.size===s).length;if(used>=stock[s])return;history.push(JSON.stringify(pieces));pieces.push({size:s,color:selectedColor,x,y,rotation});render()}function render(){grid.querySelectorAll('.brick').forEach(e=>e.remove());pieces.forEach((p,n)=>{let d=dims(p.size),c=grid.children[p.y*24+p.x],b=document.createElement('div');b.className='brick';b.style.background=p.color;b.style.width=d[1]*30-2+'px';b.style.height=d[0]*30-2+'px';b.onclick=e=>{e.stopPropagation();history.push(JSON.stringify(pieces));pieces.splice(n,1);render()};c.appendChild(b)});steps()}function steps(){let el=document.getElementById('steps');el.innerHTML=pieces.length?pieces.map((p,i)=>`<div class="step"><b>${i+1}.</b> ${p.size} · ${p.x+1},${p.y+1} · ${p.rotation?'gedreht':''}</div>`).join(''):'<p class="muted">Noch kein Bauplan.</p>'}document.getElementById('rotate').onclick=()=>{rotation=(rotation+1)%2};document.getElementById('undo').onclick=()=>{if(history.length){pieces=JSON.parse(history.pop());render()}};document.getElementById('clear').onclick=()=>{history.push(JSON.stringify(pieces));pieces=[];render()};document.getElementById('build').onclick=()=>{let text=document.getElementById('chat').value.trim();if(!text)return;alert('KI-Anbindung ist vorbereitet. Der nächste Schritt ist das Backend, das aus deinem Bestand einen echten Bauplan erzeugt.');};document.getElementById('save').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({stock,pieces},null,2)],{type:'application/json'}));a.download='lego-bauplan.json';a.click()};document.getElementById('loadBtn').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=e=>{let r=new FileReader();r.onload=()=>{let d=JSON.parse(r.result);stock=d.stock;pieces=d.pieces;render()};r.readAsText(e.target.files[0])};render();</script></body></html>
