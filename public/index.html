<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FingerGames</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>
  <div id="app">
    <!-- Join screen -->
    <div id="joinScreen" class="card">
      <h1>FingerGames</h1>
      <p class="subtext" data-lang-key="welcome">A co‑operative browser party game</p>
      <div class="input-group">
        <label data-lang-key="usernameLabel">Username</label>
        <input type="text" id="usernameInput" placeholder="Enter your name">
      </div>
      <div class="input-group">
        <label data-lang-key="languageLabel">Language</label>
        <select id="languageSelect">
          <option value="en">English</option>
          <option value="de">Deutsch</option>
        </select>
      </div>
      <button id="joinBtn" class="primary" data-lang-key="joinBtn">Join Lobby</button>
    </div>
    <!-- Lobby -->
    <div id="lobby" class="card hidden">
      <h2 data-lang-key="lobbyTitle">Lobby</h2>
      <p id="hostNote" class="notice"></p>
      <ul id="playerList"></ul>
      <div id="scoreBoard"></div>
      <button id="startSpinBtn" class="primary hidden" data-lang-key="startSpin">Start Random Game</button>
    </div>
    <!-- Spinner overlay -->
    <div id="spinnerOverlay" class="overlay hidden">
      <div id="spinner" class="spinner"></div>
      <div id="selectedGameName" class="selectedGameName"></div>
    </div>
    <!-- Instructions overlay -->
    <div id="instructionsOverlay" class="overlay hidden">
      <div class="card instructionCard">
        <h2 id="instrTitle"></h2>
        <p id="instrDesc"></p>
        <button id="startGameBtn" class="primary" data-lang-key="startGame">Start Game</button>
      </div>
    </div>
    <!-- Game canvas -->
    <div id="gameArea" class="hidden">
      <canvas id="gameCanvas"></canvas>
    </div>
    <!-- Scoreboard overlay after a round -->
    <div id="roundOverlay" class="overlay hidden">
      <div class="card scoreCard">
        <h2 data-lang-key="roundOverTitle">Round Over</h2>
        <p id="winnerNames"></p>
        <div id="scoreBoardRound"></div>
        <button id="nextRoundBtn" class="primary" data-lang-key="nextRound">Next Round</button>
      </div>
    </div>
  </div>
  <script src="/script.js"></script>
</body>
</html>
