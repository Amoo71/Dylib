name: VisionInspect
options:
  bundleIdPrefix: com.vision.inspect
targets:
  VisionInspect:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: .
    settings:
      GENERATE_INFOPLIST_FILE: YES
      CODE_SIGNING_ALLOWED: NO
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
      DEVELOPMENT_TEAM: ""

schemes:
  VisionInspect:
    build:
      targets:
        VisionInspect: [all]
    run:
      executable: VisionInspect
