name: Probe Xcode versions
on:
  push:
    branches: ["claude/happy-volta-bluupe"]
    paths: [".github/workflows/probe-xcode.yml"]
jobs:
  probe:
    strategy:
      matrix:
        os: [macos-26, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - run: |
          sw_vers
          ls -d /Applications/Xcode* || true
          xcodebuild -version
          sysctl -n machdep.cpu.brand_string
          df -h / | tail -1
