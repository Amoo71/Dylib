name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches: ["main", "work"]

jobs:
  build-ipa:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync web assets into iOS bundle
        run: ./ci/sync_web_assets.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build iOS app (unsigned)
        run: |
          xcodebuild \
            -project ios/LiquidBrowser.xcodeproj \
            -scheme LiquidBrowser \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH=$(find build -type d -name "LiquidBrowser.app" | head -n 1)
          test -n "$APP_PATH"
          mkdir -p ipa/Payload
          cp -R "$APP_PATH" ipa/Payload/
          cd ipa
          zip -r LiquidBrowser-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiquidBrowser-unsigned-ipa
          path: ipa/LiquidBrowser-unsigned.ipa
