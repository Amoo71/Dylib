name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Untermodule: UxPlay, libplist, OpenSSL-CMake, FFmpeg (eingebauter AirPlay-Empfänger)
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Das Android-SDK ist auf ubuntu-latest vorinstalliert (ANDROID_HOME).
      - name: Accept SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Test protocols & build APKs
        run: |
          chmod +x gradlew
          set -o pipefail
          # Nur Release bauen: der native AirPlay-Teil (OpenSSL, FFmpeg, UxPlay) würde sonst doppelt kompiliert
          ./gradlew --no-daemon testDebugUnitTest assembleRelease 2>&1 | tee build.log || {
            echo "::group::Fehler"; grep -E "^e: |FAILED|AssertionError|ComparisonFailure|error:|CMake Error|ninja: build stopped" build.log | head -80 || true; echo "::endgroup::"; exit 1; }

      - name: Collect APKs
        id: collect
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/RoomLauncher.apk
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: RoomLauncher-${{ steps.collect.outputs.version }}
          path: out/*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.collect.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Room Launcher v${{ steps.collect.outputs.version }}
          make_latest: true
          body: |
            Room Launcher v${{ steps.collect.outputs.version }} – Build aus Commit ${{ github.sha }}.

            **Installation:** `RoomLauncher.apk` auf dem Tablet herunterladen und installieren,
            dann Home-Taste drücken und „Room Launcher“ als Standard („Immer“) wählen.
          files: out/*.apk
