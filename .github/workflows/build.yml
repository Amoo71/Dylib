name: Build IPA
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Source Code
        run: |
          mkdir -p AppSource
          # Kopiert alle .swift Dateien in den Quellordner
          find . -name "*.swift" -maxdepth 2 -exec cp {} AppSource/ \;
          echo "Dateien in AppSource:"
          ls AppSource

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App
        run: |
          xcodebuild build \
            -project VisionInspect.xcodeproj \
            -scheme VisionInspect \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Create IPA
        run: |
          mkdir -p Payload
          # Sucht den .app Ordner
          APP_PATH=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Fehler: .app Datei wurde nicht gefunden!"
            exit 1
          fi
          cp -r "$APP_PATH" Payload/
          zip -r VisionInspect.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisionInspect-IPA
          path: VisionInspect.ipa
