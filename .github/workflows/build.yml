name: Build IPA
on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Folders and Files
        run: |
          mkdir -p AppSource
          # Suche alle Swift Dateien (egal wo) und verschiebe sie nach AppSource
          find . -name "*.swift" -exec cp {} AppSource/ \;
          ls -R AppSource/ # Debug: Zeige uns, was gefunden wurde

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App
        run: |
          xcodebuild build \
            -scheme VisionInspect \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create IPA Structure
        run: |
          mkdir -p Payload
          APP_FOLDER=$(find build/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)
          cp -r "$APP_FOLDER" Payload/
          zip -r VisionInspect.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisionInspect-IPA
          path: VisionInspect.ipa
