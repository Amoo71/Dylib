name: Build NSPiOS IPA

on:
  push:
    branches: ["**"]
    paths:
      - "NSPiOS/**"
      - ".github/workflows/nspios.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nspios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    env:
      # Build-Nummer automatisch aus Git/Actions → App erkennt neuere Versionen
      BUILD_NUMBER: ${{ github.run_number }}
      APP_VERSION: 2.1.${{ github.run_number }}
    defaults:
      run:
        working-directory: NSPiOS
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Neuestes Xcode wählen
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Xcode-Version
        run: xcodebuild -version && xcodebuild -showsdks | grep -i iphoneos

      - name: Werkzeuge installieren
        run: brew install xcodegen ldid || brew install xcodegen

      - name: Engine-Abhängigkeiten laden (Python für iOS, capstone, SPIRV-Cross, lz4)
        run: ./scripts/fetch_deps.sh

      - name: .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Shader-Übersetzer (dmsh_xlate) für iOS bauen (NativeAOT)
        run: ./scripts/build_xlate.sh

      - name: Xcode-Projekt erzeugen
        run: xcodegen generate

      - name: App bauen (Release, ohne Signatur)
        run: |
          set -o pipefail
          xcodebuild \
            -project NSPiOS.xcodeproj \
            -scheme NSPiOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            NSPIOS_UPDATE_REPO="${{ github.repository }}" \
            build 2>&1 | tee build.log | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/NSPiOS.app

      - name: Build-Log hochladen (bei Fehler)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: NSPiOS/build.log

      - name: IPA packen
        run: |
          rm -rf Payload NSPiOS.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/NSPiOS.app Payload/
          # Pseudo-Signatur, damit z. B. TrollStore die App annimmt
          if command -v ldid >/dev/null; then ldid -S Payload/NSPiOS.app/NSPiOS; fi
          zip -qry NSPiOS.ipa Payload
          ls -lh NSPiOS.ipa

      - name: IPA als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: NSPiOS-ipa
          path: NSPiOS/NSPiOS.ipa
          if-no-files-found: error

      - name: Engine-Selbsttest im iOS-Simulator
        timeout-minutes: 20
        run: |
          set -o pipefail
          xcodebuild \
            -project NSPiOS.xcodeproj \
            -scheme NSPiOS \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-sim \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build-sim.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          APP=build-sim/Build/Products/Release-iphonesimulator/NSPiOS.app
          test -d "$APP"
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if 'iPhone' in x['name']))")
          echo "Simulator: $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch --console-pty "$DEVICE" de.amoo71.NSPiOS -nspios-selftest 2>&1 | tee selftest.log || true
          grep -q "NSPIOS_SELFTEST_OK" selftest.log
          # Packer-Probe: Shell laden, Packer vorbereiten, Fake-Spiel bis nach dem Entpacken
          xcrun simctl launch --console-pty "$DEVICE" de.amoo71.NSPiOS -nspios-packtest 2>&1 | tee packtest.log || true
          grep -q "NSPIOS_PACKTEST_OK" packtest.log

      - name: Crash-Reports und System-Log sammeln (bei Fehler)
        if: failure()
        run: |
          mkdir -p diag
          cp ~/Library/Logs/DiagnosticReports/*NSPiOS* diag/ 2>/dev/null || true
          xcrun simctl spawn booted log show --last 10m --style compact --predicate 'process == "NSPiOS"' > diag/system.log 2>&1 || true
          ls -la diag

      - name: Simulator-Logs hochladen (bei Fehler)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-log
          path: |
            NSPiOS/build-sim.log
            NSPiOS/selftest.log
            NSPiOS/packtest.log
            NSPiOS/diag/
          if-no-files-found: ignore

      - name: Release für In-App-Updates veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nspios-b${{ env.BUILD_NUMBER }}
          name: NSPiOS ${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          body: ${{ github.event.head_commit.message || 'Manueller Build' }}
          files: NSPiOS/NSPiOS.ipa

      - name: Alte NSPiOS-Releases aufräumen (letzte 5 behalten)
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '.[].tagName' \
            | grep '^nspios-b[0-9]*$' | sort -t b -k2 -n -r | tail -n +6 \
            | xargs -r -I{} gh release delete {} --repo "${{ github.repository }}" --yes --cleanup-tag || true
