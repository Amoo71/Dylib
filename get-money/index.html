<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Get Money</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{display:grid;place-items:center;overflow:hidden;background:#030303;font-family:Inter,Arial,sans-serif}
.stage{perspective:1100px;position:relative}
.stage:before{content:"";position:absolute;left:50%;top:50%;width:250px;height:150px;transform:translate(-50%,-25%);border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.13),transparent 68%);filter:blur(28px);opacity:.42;transition:opacity .8s ease,transform .8s cubic-bezier(.16,1,.3,1)}
.stage:hover:before{opacity:.7;transform:translate(-50%,-25%) scale(1.18)}
button{--rx:0deg;--ry:0deg;--lift:0px;position:relative;isolation:isolate;overflow:hidden;min-width:230px;height:78px;padding:0 46px;border:1px solid rgba(255,255,255,.2);border-radius:18px;color:#fff;background:linear-gradient(145deg,#292929 0%,#151515 42%,#090909 100%);font:800 27px/1 Inter,Arial,sans-serif;letter-spacing:-.8px;cursor:pointer;transform:translateY(var(--lift)) rotateX(var(--rx)) rotateY(var(--ry));transform-style:preserve-3d;will-change:transform,box-shadow;box-shadow:0 2px 0 #000,0 5px 0 #0a0a0a,0 10px 0 #050505,0 22px 35px rgba(0,0,0,.72),inset 0 1px 0 rgba(255,255,255,.16),inset 0 -2px 5px rgba(0,0,0,.6);transition:transform .65s cubic-bezier(.16,1,.3,1),box-shadow .65s cubic-bezier(.16,1,.3,1),border-color .5s ease}
button:before{content:"";position:absolute;inset:1px;border-radius:17px;background:linear-gradient(135deg,rgba(255,255,255,.12),transparent 32%,transparent 68%,rgba(255,255,255,.035));z-index:-1}
button:after{content:"";position:absolute;inset:-40%;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.13) 48%,rgba(255,255,255,.02) 53%,transparent 66%);transform:translateX(-75%) rotate(8deg);transition:transform 1s cubic-bezier(.16,1,.3,1);pointer-events:none}
button:hover{--lift:-7px;border-color:rgba(255,255,255,.34);box-shadow:0 2px 0 #000,0 6px 0 #0a0a0a,0 12px 0 #050505,0 30px 55px rgba(0,0,0,.85),0 0 45px rgba(255,255,255,.07),inset 0 1px 0 rgba(255,255,255,.2),inset 0 -2px 6px rgba(0,0,0,.55)}
button:hover:after{transform:translateX(75%) rotate(8deg)}
button:active{--lift:2px;transform:translateY(2px) rotateX(1deg) rotateY(0deg);box-shadow:0 1px 0 #000,0 3px 0 #050505,0 10px 18px rgba(0,0,0,.65),inset 0 2px 7px rgba(0,0,0,.7);transition-duration:.12s}
button span{display:inline-block;transform:translateZ(20px);text-shadow:0 1px 0 #000,0 3px 12px rgba(0,0,0,.55)}
@media(prefers-reduced-motion:reduce){button,.stage:before,button:after{transition:none!important}}
</style>
</head>
<body>
<div class="stage"><button id="getMoney"><span>Get Money</span></button></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const stage=document.querySelector('.stage'),button=document.getElementById('getMoney');
stage.addEventListener('pointermove',e=>{const r=button.getBoundingClientRect(),x=(e.clientX-(r.left+r.width/2))/(r.width/2),y=(e.clientY-(r.top+r.height/2))/(r.height/2);button.style.setProperty('--ry',`${x*5}deg`);button.style.setProperty('--rx',`${-y*5}deg`)});
stage.addEventListener('pointerleave',()=>{button.style.setProperty('--ry','0deg');button.style.setProperty('--rx','0deg')});
function getISOWeek(date){const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));const day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);const yearStart=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil((((d-yearStart)/86400000)+1)/7)}
button.addEventListener('click',()=>{const kw=getISOWeek(new Date()),rows=[['KW-Woche',`KW ${kw}`],[],['Rang','Name'],[1,'Amo']],ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:14},{wch:24}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Liste');XLSX.writeFile(wb,`Get-Money-KW-${kw}.xlsx`)});
</script>
</body>
</html>
