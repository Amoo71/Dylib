<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Get Money</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{display:grid;place-items:center;overflow:hidden;background:#030303;font-family:Inter,Arial,sans-serif}.stage{perspective:1200px;position:relative}.stage:before{content:"";position:absolute;left:50%;top:58%;width:260px;height:150px;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(ellipse,rgba(255,255,255,.14),transparent 68%);filter:blur(30px);opacity:.45;transition:.9s cubic-bezier(.16,1,.3,1)}.stage:hover:before{opacity:.8;transform:translate(-50%,-45%) scale(1.18)}
button{--rx:0deg;--ry:0deg;--lift:0px;position:relative;isolation:isolate;overflow:hidden;min-width:250px;height:82px;padding:0 48px;border:1px solid rgba(255,255,255,.2);border-radius:19px;color:#fff;background:linear-gradient(145deg,#303030 0%,#191919 38%,#0b0b0b 100%);font:800 28px/1 Inter,Arial,sans-serif;letter-spacing:-.8px;cursor:pointer;transform:translateY(var(--lift)) rotateX(var(--rx)) rotateY(var(--ry));transform-style:preserve-3d;will-change:transform;box-shadow:0 2px 0 #000,0 5px 0 #0a0a0a,0 9px 0 #060606,0 16px 0 #030303,0 28px 42px rgba(0,0,0,.8),inset 0 1px 0 rgba(255,255,255,.2),inset 0 -3px 7px rgba(0,0,0,.65);transition:transform .7s cubic-bezier(.16,1,.3,1),box-shadow .7s cubic-bezier(.16,1,.3,1),border-color .5s ease}
button:before{content:"";position:absolute;inset:1px;border-radius:18px;background:linear-gradient(135deg,rgba(255,255,255,.15),transparent 28%,transparent 65%,rgba(255,255,255,.035));z-index:-1}button:after{content:"";position:absolute;inset:0;border-radius:18px;background:linear-gradient(110deg,transparent 22%,rgba(255,255,255,.16) 46%,rgba(255,255,255,.025) 53%,transparent 72%);transform:translateX(-130%);transition:transform 1.15s cubic-bezier(.16,1,.3,1);pointer-events:none}button:hover{--lift:-8px;border-color:rgba(255,255,255,.38);box-shadow:0 2px 0 #000,0 6px 0 #0a0a0a,0 11px 0 #060606,0 19px 0 #030303,0 36px 60px rgba(0,0,0,.9),0 0 45px rgba(255,255,255,.075),inset 0 1px 0 rgba(255,255,255,.24),inset 0 -3px 7px rgba(0,0,0,.58)}button:hover:after{transform:translateX(130%)}button:active{--lift:3px;transform:translateY(3px) rotateX(2deg) rotateY(0deg);box-shadow:0 1px 0 #000,0 4px 0 #050505,0 10px 18px rgba(0,0,0,.7),inset 0 3px 8px rgba(0,0,0,.75);transition-duration:.1s}button span{display:inline-block;transform:translateZ(24px);text-shadow:0 1px 0 #000,0 4px 14px rgba(0,0,0,.6)}
@media(prefers-reduced-motion:reduce){button,.stage:before,button:after{transition:none!important}}
</style>
</head>
<body>
<div class="stage"><button id="getMoney"><span>Get Money</span></button></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const stage=document.querySelector('.stage'),button=document.getElementById('getMoney');stage.addEventListener('pointermove',e=>{const r=button.getBoundingClientRect(),x=(e.clientX-(r.left+r.width/2))/(r.width/2),y=(e.clientY-(r.top+r.height/2))/(r.height/2);button.style.setProperty('--ry',`${x*6}deg`);button.style.setProperty('--rx',`${-y*6}deg`)});stage.addEventListener('pointerleave',()=>{button.style.setProperty('--ry','0deg');button.style.setProperty('--rx','0deg')});
function getISOWeek(date){const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));const day=d.getUTCDay()||7;d.setUTCDate(d.getUTCDate()+4-day);const yearStart=new Date(Date.UTC(d.getUTCFullYear(),0,1));return Math.ceil((((d-yearStart)/86400000)+1)/7)}
button.addEventListener('click',()=>{const kw=getISOWeek(new Date());const rows=[['GET MONEY',''],['Kalenderwoche',`KW ${kw}`],[],['Vorname','Nachname','ID','Betrag (€)','Kürzel'],['Armando','Zana','01234',300,'AR']];const ws=XLSX.utils.aoa_to_sheet(rows);ws['!cols']=[{wch:18},{wch:18},{wch:14},{wch:16},{wch:12}];ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:4}}];const header={fill:{fgColor:{rgb:'111111'}},font:{bold:true,color:{rgb:'FFFFFF'},sz:12},alignment:{horizontal:'center',vertical:'center'}};['A1','A2','A4','B4','C4','D4','E4'].forEach(c=>{if(ws[c])ws[c].s=header});ws['D5'].z='#,##0.00 "€"';ws['C5'].t='s';ws['C5'].z='@';ws['A1'].s={font:{bold:true,color:{rgb:'FFFFFF'},sz:18},fill:{fgColor:{rgb:'111111'}},alignment:{horizontal:'center',vertical:'center'}};ws['!rows']=[{hpt:28},{hpt:22},{},{hpt:24},{hpt:22}];const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Get Money');XLSX.writeFile(wb,`Get-Money-KW-${kw}.xlsx`)});
</script>
</body>
</html>
